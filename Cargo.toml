[workspace]
members = [
   "client",
   "example",
   "proxy",
   "prover",
]
resolver = "2"

[workspace.dependencies]
ark-std = { version = "0.5", features = ["parallel"] }
ark-ff = { version = "0.5", features = ["parallel"] }
ark-ec = { version = "0.5", features = ["parallel"] }
ark-bn254 = "0.5"
ark-groth16 = { version = "0.5", default-features = false, features = ["parallel"] }
ark-r1cs-std = { version = "0.5", features = ["parallel"] }
ark-snark = "0.5"
ark-relations = "0.5"
rustls = { git = "https://github.com/confuseSUN/rustls" }
tokio-rustls = { git = "https://github.com/confuseSUN/tokio-rustls" }